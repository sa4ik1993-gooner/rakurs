<!doctype html>
<html lang="uk">
<head>
<script>/* вход в HEYROW Beauty: если ссылка из письма открыла этот адрес, а вход начинали в beauty.html — перейти туда с теми же данными входа */(function(){try{var bt=+localStorage.getItem("beauty_back");if(bt&&Date.now()-bt<864e5&&/access_token|code=|error_description/.test(location.hash+location.search)){localStorage.removeItem("beauty_back");location.replace("beauty.html"+location.search+location.hash)}}catch(e){}})()</script>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HEYROW</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="HEYROW — ІІ-таргетолог для онлайн-шкіл: голосове керування рекламою, досмотри по секундах, гіпотези з продажів, рахунок по оплатах.">
<script src="brand.js?v=202611251012"></script>
<style>
/* Layout: the page is an editing suite — a tick ruler under the header, a scrubbable
   retention curve inside a viewfinder frame as the hero, square corners everywhere. */
/* Цвета и шрифты задаются в brand.js — здесь только var(--имя). */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,4.6vw,52px);line-height:1.08}
h2{font-size:clamp(24px,3vw,34px);line-height:1.15}
h3{font-size:16px;line-height:1.3;font-weight:500}
p{margin:0}
.eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--track)}
.lead{color:var(--muted);max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border:1.5px solid var(--ink);border-radius:2px;
  font:600 15px/1 var(--f-body);text-decoration:none;cursor:pointer;transition:transform .15s ease,background .15s ease,color .15s ease}
.btn--solid{background:var(--ink);color:var(--on-ink)}
.btn--ghost{background:transparent;color:var(--ink)}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:2.5px solid var(--play);outline-offset:3px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
.top__row{display:flex;align-items:center;gap:24px;min-height:64px}
.logo{display:inline-flex;align-items:center;gap:10px;font:700 17px/1 var(--f-display);letter-spacing:.04em;text-decoration:none}
.logo i{width:18px;height:18px;border-left:3px solid var(--play);border-top:3px solid var(--play);display:block}
.nav{display:flex;gap:22px;margin-left:auto;font-size:15px}
.nav a{text-decoration:none;color:var(--muted)}
.nav a:hover{color:var(--ink)}
.lang{display:flex;border:1.5px solid var(--line);border-radius:2px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);font:600 12px/1 var(--f-mono);padding:8px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.top .btn{min-height:40px;padding:0 16px;font-size:14px}
.ruler{height:14px;border-bottom:1px solid var(--line);
  background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 12px),repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 120px);
  background-size:auto 6px,auto 14px;background-repeat:repeat-x;background-position:0 100%,0 100%}

section{padding-block:72px}
.hero{padding-block:56px 64px}
.hero__grid{display:grid;grid-template-columns:1.02fr .98fr;gap:56px;align-items:center}
.hero__grid>*{min-width:0}
.hero__copy{display:flex;flex-direction:column;gap:22px;animation:rise .6s ease both}
.hero__cta{display:flex;flex-wrap:wrap;gap:12px}
.hero__note{font:400 13px/1.4 var(--f-mono);color:var(--muted)}
@keyframes rise{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}

/* viewfinder */
.vf{position:relative;background:var(--surface);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:14px;animation:rise .7s .08s ease both}
.vf::before,.vf::after,.vf>b::before,.vf>b::after{content:"";position:absolute;width:22px;height:22px;border:3px solid var(--ink)}
.vf::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.vf::after{right:-2px;top:-2px;border-left:0;border-bottom:0}
.vf>b::before{left:-2px;bottom:-2px;border-right:0;border-top:0}
.vf>b::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.vf__head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.vf__title{font:600 12px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:6px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--muted);font:600 12px/1 var(--f-mono);padding:8px 10px;border-radius:2px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--track);background:var(--track-soft);color:var(--ink)}
.vf svg{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.vf__read{display:flex;align-items:baseline;gap:14px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.vf__read strong{font:700 30px/1 var(--f-display);color:var(--ink)}
.vf__read span{font-size:13px;color:var(--muted)}
.vf__cap{font-size:14px;color:var(--muted)}
.g-grid{stroke:var(--line);stroke-width:1}
.g-lab{fill:var(--muted);font:400 10.5px var(--f-mono)}
.g-area{fill:var(--track-soft)}
.g-on{fill:none;stroke:var(--track);stroke-width:2.5;stroke-linejoin:round}
.g-off{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 5;opacity:.7}
.g-cut{stroke:var(--play);stroke-width:1.5;stroke-dasharray:5 4}
.g-cutlab{fill:var(--play);font:600 11px var(--f-mono)}
.g-head{stroke:var(--ink);stroke-width:1.5}
.g-dot{fill:var(--ink)}

/* proof */
.proof{border-block:1px solid var(--line);padding-block:56px}
.proof__head{display:flex;flex-direction:column;gap:12px;margin-bottom:36px}
.proof__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.proof__grid>div{display:flex;flex-direction:column;gap:10px;min-width:0}
.num{font:700 clamp(34px,4.4vw,52px)/1 var(--f-display);font-variant-numeric:tabular-nums}
.proof__grid p{color:var(--muted);font-size:15.5px}

/* how */
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.split>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.steps{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-direction:column;gap:26px;counter-reset:s}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:14px;counter-increment:s}
.steps li::before{content:"0" counter(s);font:600 13px/1.9 var(--f-mono);color:var(--play)}
.steps p{color:var(--muted);font-size:15.5px;margin-top:6px}
/* bot mock */
.bot{background:var(--surface);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:96px}
.bot__bar{font:600 12px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.msg{max-width:88%;padding:12px 14px;border-radius:2px;font-size:14.5px}
.msg--me{align-self:flex-end;background:var(--track-soft);display:flex;align-items:center;gap:10px}
.wave{display:flex;align-items:center;gap:3px;height:22px}
.wave i{width:3px;background:var(--track);display:block}
.msg--me small{font:400 11px var(--f-mono);color:var(--muted)}
.card{border:1.5px solid var(--ink);padding:14px;display:flex;flex-direction:column;gap:10px}
.card__t{font:600 12px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-size:13px;overflow-wrap:anywhere}
.card__btns{display:flex;gap:8px;flex-wrap:wrap}
.card__btns span{font:600 13px/1 var(--f-body);padding:10px 14px;border:1.5px solid var(--ink);border-radius:2px}
.card__btns span:first-child{background:var(--ink);color:var(--on-ink)}

/* features */
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:0 40px;margin-top:36px}
.feat>div{border-top:1px solid var(--line);padding-block:22px 30px;display:flex;flex-direction:column;gap:10px;min-width:0}
.feat p{color:var(--muted);font-size:15.5px}
.tag{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--track)}

/* fit */
.fit{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:32px}
.fit ul{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.fit li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:16px}
.fit li::before{content:"";width:14px;height:14px;margin-top:5px;border:2px solid var(--track);background:var(--track)}
.fit .no li::before{background:transparent;border-color:var(--muted)}
.fit .no li{color:var(--muted)}

/* pricing */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px;align-items:stretch}
.plan{background:var(--surface);border:1px solid var(--line);padding:26px;display:flex;flex-direction:column;gap:16px;min-width:0}
.plan--main{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.plan.plan--main .plan__for,.plan.plan--main li{color:color-mix(in srgb,var(--on-ink) 78%,transparent)}
.plan--main .btn{border-color:var(--on-ink);background:var(--on-ink);color:var(--ink)}
.plan__name{font:600 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.plan__price{font:700 38px/1 var(--f-display);font-variant-numeric:tabular-nums}
.plan__price small{font:400 14px var(--f-body);opacity:.75}
.plan__for{color:var(--muted);font-size:14.5px}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:15px;flex:1}
.plan li{padding-left:16px;position:relative;color:var(--muted)}
.plan li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:2px;background:currentColor}
.fine{font:400 13px/1.5 var(--f-mono);color:var(--muted);margin-top:18px;max-width:80ch}

/* faq */
.faq{margin-top:28px;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:18px 36px 18px 0;font-weight:600;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:4px;top:14px;font:400 24px/1 var(--f-mono);color:var(--play)}
.faq details[open] summary::after{content:"–"}
.faq p{color:var(--muted);padding:0 0 20px;max-width:70ch}

/* form */
.book{background:var(--surface);border-top:1px solid var(--line)}
.book__grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:56px;align-items:start}
.book__grid>*{min-width:0}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f--wide{grid-column:1/-1}
label{font:600 12px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input,select{width:100%;min-height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:2px;background:var(--bg);color:var(--ink);font:400 16px var(--f-body)}
input:hover,select:hover{border-color:var(--muted)}
form .btn{grid-column:1/-1}
.ok{border:1.5px solid var(--track);padding:26px;display:flex;flex-direction:column;gap:10px}
.ok small{font:400 13px/1.5 var(--f-mono);color:var(--play)}
.err{grid-column:1/-1;color:var(--play);font-size:14px}

footer{padding-block:28px;font:400 13px var(--f-mono);color:var(--muted);border-top:1px solid var(--line)}

@media (max-width:900px){
  section{padding-block:52px}
  .hero__grid,.split,.book__grid,.fit{grid-template-columns:1fr;gap:36px}
  .proof__grid,.feat,.plans{grid-template-columns:1fr}
  .proof__grid{gap:28px}
  .nav{display:none}
  .lang{margin-left:auto}
  .bot{position:static}
}
@media (max-width:520px){
  form{grid-template-columns:1fr}
  .top .btn{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top__row">
    <a class="logo" href="#top-anchor" data-brand="logo">HEYROW</a>
    <nav class="nav" aria-label="main">
      <a href="#how" data-i18n="nav_how"></a>
      <a href="#features" data-i18n="nav_feat"></a>
      <a href="#pricing" data-i18n="nav_price"></a>
    </nav>
    <div class="lang" role="group" aria-label="language">
      <button type="button" data-lang="uk" aria-pressed="true">UA</button>
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    </div>
    <a class="btn btn--solid" href="#book" data-i18n="nav_cta"></a>
  </div>
  <div class="ruler" aria-hidden="true"></div>
</header>

<main id="top-anchor">

<section class="hero">
  <div class="wrap hero__grid">
    <div class="hero__copy">
      <span class="eyebrow" data-i18n="hero_eyebrow"></span>
      <h1 data-i18n="hero_h1"></h1>
      <p class="lead" data-i18n="hero_sub"></p>
      <div class="hero__cta">
        <a class="btn btn--solid" href="#book" data-i18n="hero_cta"></a>
        <a class="btn btn--ghost" href="demo.html#sample" data-i18n="hero_cta2"></a>
      </div>
      <p class="hero__note" data-i18n="hero_note"></p>
    </div>

    <div class="vf" aria-label="retention example">
      <b aria-hidden="true"></b>
      <div class="vf__head">
        <span class="vf__title" data-i18n="w_title"></span>
        <div class="chips" role="group">
          <button type="button" class="chip" id="chip-v1" data-v="v1" aria-pressed="true" data-i18n="w_v1"></button>
          <button type="button" class="chip" id="chip-v2" data-v="v2" aria-pressed="false" data-i18n="w_v2"></button>
        </div>
      </div>
      <svg id="ret" viewBox="0 0 560 280" role="img" aria-label="retention curve"></svg>
      <div class="vf__read"><strong id="ret-pct">44%</strong><span><span id="ret-time">0:04</span> · <span data-i18n="w_left"></span></span></div>
      <p class="vf__cap" data-i18n="w_cap"></p>
    </div>
  </div>
</section>

<section class="proof">
  <div class="wrap">
    <div class="proof__head">
      <span class="eyebrow" data-i18n="proof_eyebrow"></span>
      <p class="lead" data-i18n="proof_lead"></p>
    </div>
    <div class="proof__grid">
      <div><span class="num">31%</span><p data-i18n="p1"></p></div>
      <div><span class="num" data-i18n="p2_num"></span><p data-i18n="p2"></p></div>
      <div><span class="num">×2</span><p data-i18n="p3"></p></div>
    </div>
  </div>
</section>

<section id="how">
  <div class="wrap split">
    <div>
      <div class="stack">
        <span class="eyebrow" data-i18n="how_eyebrow"></span>
        <h2 data-i18n="how_h2"></h2>
      </div>
      <ol class="steps">
        <li><div><h3 data-i18n="h1_t"></h3><p data-i18n="h1_d"></p></div></li>
        <li><div><h3 data-i18n="h2_t"></h3><p data-i18n="h2_d"></p></div></li>
        <li><div><h3 data-i18n="h3_t"></h3><p data-i18n="h3_d"></p></div></li>
        <li><div><h3 data-i18n="h4_t"></h3><p data-i18n="h4_d"></p></div></li>
      </ol>
    </div>
    <div class="bot" aria-label="bot example">
      <div class="bot__bar"><span><span data-brand="name">HEYROW</span> bot</span><span data-i18n="bot_ex"></span></div>
      <div class="msg msg--me">
        <span class="wave" aria-hidden="true"><i style="height:8px"></i><i style="height:16px"></i><i style="height:22px"></i><i style="height:12px"></i><i style="height:18px"></i><i style="height:9px"></i><i style="height:20px"></i><i style="height:14px"></i><i style="height:6px"></i><i style="height:17px"></i><i style="height:11px"></i></span>
        <small>0:07</small>
      </div>
      <div class="card">
        <span class="card__t" data-i18n="bot_card"></span>
        <dl class="kv">
          <dt data-i18n="bot_k1"></dt><dd data-i18n="bot_v1"></dd>
          <dt data-i18n="bot_k2"></dt><dd>priglos_v5, viktor_v2, systema_v3</dd>
          <dt data-i18n="bot_k3"></dt><dd data-i18n="bot_v3"></dd>
          <dt data-i18n="bot_k4"></dt><dd data-i18n="bot_v4"></dd>
          <dt data-i18n="bot_k5"></dt><dd data-i18n="bot_v5"></dd>
        </dl>
        <div class="card__btns"><span data-i18n="bot_go"></span><span data-i18n="bot_edit"></span></div>
      </div>
    </div>
  </div>
</section>

<section id="features" style="padding-top:0">
  <div class="wrap">
    <div class="stack">
      <span class="eyebrow" data-i18n="feat_eyebrow"></span>
      <h2 data-i18n="feat_h2"></h2>
    </div>
    <div class="feat">
      <div><span class="tag" data-i18n="f1_g"></span><h3 data-i18n="f1_t"></h3><p data-i18n="f1_d"></p></div>
      <div><span class="tag" data-i18n="f2_g"></span><h3 data-i18n="f2_t"></h3><p data-i18n="f2_d"></p></div>
      <div><span class="tag" data-i18n="f3_g"></span><h3 data-i18n="f3_t"></h3><p data-i18n="f3_d"></p></div>
      <div><span class="tag" data-i18n="f4_g"></span><h3 data-i18n="f4_t"></h3><p data-i18n="f4_d"></p></div>
      <div><span class="tag" data-i18n="f5_g"></span><h3 data-i18n="f5_t"></h3><p data-i18n="f5_d"></p></div>
      <div><span class="tag" data-i18n="f6_g"></span><h3 data-i18n="f6_t"></h3><p data-i18n="f6_d"></p></div>
    </div>
    <div class="fit">
      <div><h3 data-i18n="fit_yes"></h3><ul><li data-i18n="y1"></li><li data-i18n="y2"></li><li data-i18n="y3"></li></ul></div>
      <div class="no"><h3 data-i18n="fit_no"></h3><ul><li data-i18n="n1"></li><li data-i18n="n2"></li><li data-i18n="n3"></li></ul></div>
    </div>
  </div>
</section>

<section id="pricing" style="padding-top:0">
  <div class="wrap">
    <div class="stack">
      <span class="eyebrow" data-i18n="price_eyebrow"></span>
      <h2 data-i18n="price_h2"></h2>
    </div>
    <div class="plans">
      <div class="plan">
        <span class="plan__name">Lite</span>
        <span class="plan__price">$69 <small data-i18n="per"></small></span>
        <p class="plan__for" data-i18n="pl1_for"></p>
        <ul><li data-i18n="pl1_a"></li><li data-i18n="pl1_b"></li><li data-i18n="pl1_c"></li><li data-i18n="pl1_d"></li><li data-i18n="pl1_e"></li></ul>
        <a class="btn btn--ghost" href="#book" data-plan="Lite" data-i18n="plan_cta"></a>
      </div>
      <div class="plan plan--main">
        <span class="plan__name">Pro</span>
        <span class="plan__price">$299 <small data-i18n="per"></small></span>
        <p class="plan__for" data-i18n="pl2_for"></p>
        <ul><li data-i18n="pl2_a"></li><li data-i18n="pl2_b"></li><li data-i18n="pl2_c"></li><li data-i18n="pl2_d"></li><li data-i18n="pl2_e"></li><li data-i18n="pl2_f"></li></ul>
        <a class="btn" href="#book" data-plan="Pro" data-i18n="plan_cta"></a>
      </div>
      <div class="plan">
        <span class="plan__name">Agency</span>

let lang = "uk";
try { const s = localStorage.getItem("heyrow_lang"); if (s === "ru" || s === "uk") lang = s; } catch (e) {}
try { const q = new URLSearchParams(location.search).get("lang"); if (q === "ru" || q === "uk") lang = q; } catch (e) {}
const t = k => ((I18N[lang] && I18N[lang][k]) || k).replace(/\{brand\}/g, BRAND.name);

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  drawRet();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("heyrow_lang", lang); } catch (e) {} applyLang();
}));

/* ---- график досмотров (пример) ---- */
const RET = {
  v1:[100,86,74,61,44,41,39,37,36,34,33,31,30,29,28,27,26,25,24,23,22,21,20,19,18,17,16,15,15,14,13],
  v2:[100,93,88,84,80,77,74,71,68,66,64,62,60,58,56,54,52,50,48,47,45,44,42,41,40,38,37,36,35,34,33]
};
let cur = "v1", head = 4;
const svg = document.getElementById("ret");
const X = s => 44 + s / 30 * 496, Y = p => 236 - p / 100 * 204;
const line = a => a.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p).toFixed(1)).join("");
const tc = s => "0:" + String(s).padStart(2, "0");
function drawRet(){
  const on = RET[cur], off = RET[cur === "v1" ? "v2" : "v1"];
  let h = "";
  [0,25,50,75,100].forEach(p => { h += `<line class="g-grid" x1="44" x2="540" y1="${Y(p)}" y2="${Y(p)}"/><text class="g-lab" x="36" y="${Y(p)+3.5}" text-anchor="end">${p}%</text>`; });
  [0,5,10,15,20,25,30].forEach(s => { h += `<text class="g-lab" x="${X(s)}" y="256" text-anchor="middle">${tc(s)}</text>`; });
  h += `<path class="g-area" d="${line(on)}L${X(30)} ${Y(0)}L${X(0)} ${Y(0)}Z"/>`;
  h += `<path class="g-off" d="${line(off)}"/><path class="g-on" d="${line(on)}"/>`;
  if (cur === "v1") h += `<line class="g-cut" x1="${X(4)}" x2="${X(4)}" y1="${Y(100)}" y2="${Y(0)}"/><text class="g-cutlab" x="${X(4)+8}" y="${Y(62)}">${t("w_cut")}</text>`;
  h += `<line class="g-head" x1="${X(head)}" x2="${X(head)}" y1="${Y(on[head])}" y2="${Y(0)}"/><circle class="g-dot" cx="${X(head)}" cy="${Y(on[head])}" r="5"/>`;
  svg.innerHTML = h;
  document.getElementById("ret-pct").textContent = on[head] + "%";
  document.getElementById("ret-time").textContent = tc(head);
}
function scrub(e){
  const r = svg.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 560;
  head = Math.max(0, Math.min(30, Math.round((x - 44) / 496 * 30)));
  drawRet();
}
svg.addEventListener("pointermove", scrub);
svg.addEventListener("pointerdown", scrub);
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  cur = c.dataset.v;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === c)));
  drawRet();
}));

/* ---- тариф из карточки подставляется в форму ---- */
document.querySelectorAll("[data-plan]").forEach(a => a.addEventListener("click", () => {
  document.getElementById("f-plan").value = a.dataset.plan;
}));

/* ---- форма записи ---- */
const form = document.getElementById("lead"), ok = document.getElementById("lead-ok"), err = document.getElementById("lead-err");
form.addEventListener("submit", async e => {
  e.preventDefault();
  if (!form.name.value.trim() || !form.contact.value.trim()) { err.hidden = false; return; }
  err.hidden = true;
  const data = Object.fromEntries(new FormData(form));
  data.lang = lang; data.ts = new Date().toISOString(); data.page = location.href;
  if (CONFIG.formEndpoint) {
    try { await fetch(CONFIG.formEndpoint, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(data) }); }
    catch (x) { err.hidden = false; return; }
    if (window.fbq) window.fbq("track", "Schedule");
  }
  form.hidden = true; ok.hidden = false;
  document.getElementById("lead-preview").hidden = Boolean(CONFIG.formEndpoint);
});

/* ---- пиксель Meta подключается только когда указан ID ---- */
if (CONFIG.metaPixelId) {
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
  s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");
  window.fbq("init", CONFIG.metaPixelId); window.fbq("track", "PageView");
}

applyLang();
</script>
