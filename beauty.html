<!doctype html>
<html lang="uk" data-ui="app">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HEYROW Beauty</title>
<script src="brand.js?v=202611241814"></script>
<link rel="stylesheet" href="app.css?v=202611241814">
<style>
/* HEYROW Beauty: только раскладка; цвета, шрифты, отступы — токены из ui/tokens.css через app.css */
body{background:var(--grad-page,var(--paper))}
.lite{max-width:1120px;margin:0 auto;padding-block:var(--s-4) var(--s-7);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:var(--s-4)}
.lite-bar{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
.lite-bar img{display:block}
.lite-brand{display:flex;align-items:center;gap:var(--s-2)}.lite-brand b{font:800 13px/1 var(--font-display);color:var(--signal);letter-spacing:.02em}
.lite-name{font:700 15px/1.2 var(--font-ui)}
.lite-bar__r{margin-left:auto;display:flex;gap:var(--s-2);align-items:center;flex-wrap:wrap}
.lite-hero .hp__t{flex:1}
.lite-login{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-top:var(--s-2)}
.lite-login input{flex:1 1 220px;min-height:var(--control);border:1px solid var(--glass-line);border-radius:var(--r-pill);background:var(--glass);color:var(--on-dark);padding:0 var(--s-4)}
.lite-login input::placeholder{color:var(--on-dark-dim)}
.lite-fine{font-size:var(--t-small);color:var(--on-dark-dim)!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lite-state{align-items:center;text-align:center;padding-block:var(--s-6)}
.lite-state img{filter:drop-shadow(0 10px 14px rgba(0,0,0,.18))}
.lite-path{display:flex;align-items:stretch;gap:var(--s-2);background:var(--surface);border-radius:var(--r-panel);box-shadow:var(--lift);padding:var(--s-4)}
.lite-path>div{flex:1;display:flex;flex-direction:column;gap:var(--s-1);min-width:0}
.lite-path>i{align-self:center;font-style:normal;color:var(--signal);font-weight:700}
.lite-path b{font:800 28px/1 var(--font-display);font-variant-numeric:tabular-nums}
.lite-path .tag{font:700 var(--t-label)/1.2 var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lite-cols{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:var(--s-4);align-items:start}
.lite-cols .panel{border:0;box-shadow:var(--lift)}
.lite-grid{display:grid;grid-template-columns:1fr;gap:var(--s-3)}
.lite-sum{display:flex;gap:var(--s-2);align-items:center}
.lite-sum input{flex:1;min-width:0}
.lite-list{display:flex;flex-direction:column}
.lite-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(96px,auto) auto;gap:var(--s-3);align-items:center;padding:var(--s-2) 0;border-top:1px solid var(--line)}
.lite-row:first-child{border-top:0}
.lite-row__m{display:flex;flex-direction:column;min-width:0}
.lite-row__m b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lite-row__a{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.lite-x{color:var(--muted)}
.lite-amt{display:flex;gap:var(--s-1);align-items:center}.lite-amt input{width:84px;min-height:var(--control-sm);border:1px solid var(--line-strong);border-radius:var(--r-control);padding:0 var(--s-2);text-align:right}
.lite-capi{display:block;font-weight:500;font-size:var(--t-small);color:var(--plus)}.lite-capi--err{color:var(--minus)}
.lite-row__a{white-space:nowrap}
.seg--xs button{padding:0 var(--s-2);font-size:var(--t-small)}
.lite-t{width:100%;border-collapse:collapse;min-width:640px}
.lite-t th{font:700 10px/1.2 var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:var(--s-3)}
.lite-t th:first-child,.lite-t td:first-child{text-align:left}
.lite-t td{padding:var(--s-2) var(--s-3);border-top:1px solid var(--line);height:44px}
.lite-t td small{display:block}.lite-t td:first-child{min-width:200px}
.lite-t .num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lite-t .bad{color:var(--minus)}
.lite-cols .panel>.tw,.panel .tw{box-shadow:none}
.lite-busy{text-align:center}
@media (max-width:900px){.lite-cols{grid-template-columns:1fr}.hp__h{display:none}}
@media (max-width:560px){.lite-path{flex-direction:column}.lite-path>i{transform:rotate(90deg)}.lite-row{grid-template-columns:minmax(0,1fr) auto;row-gap:var(--s-2)}.lite-row__m{grid-area:1/1}.lite-row__a{grid-area:1/2}.lite-row>.seg{grid-area:2/1;justify-self:start}.lite-row>:last-child{grid-area:2/2;justify-self:end}}
/* отдельный кабинет: боковая панель как в основном HEYROW, упрощённая */
.bty{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.bty>.lite{max-width:1120px;width:100%;margin:0 auto}
.bty-rail{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.bty-tag{align-self:flex-start;margin:calc(-1 * var(--s-3)) 0 0 var(--s-2);font:800 12px/1 var(--font-display);color:var(--signal);letter-spacing:0}
.bty-name{padding:0 var(--s-2);font:600 var(--t-body)/1.3 var(--font-ui);color:var(--on-dark)}
.bty-sel{margin:0 var(--s-2);min-height:var(--control-sm);border:1px solid var(--glass-line);border-radius:var(--r-control);background:var(--glass);color:var(--on-dark);padding:0 var(--s-2)}
.bty-sel option{color:var(--ink)}
.bty-mail{color:var(--on-dark-dim);font-size:var(--t-small);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bty-rail .rail__foot{gap:var(--s-2);margin-top:auto}
.bty-rail .seg{background:var(--glass)}.bty-rail .seg button{color:var(--on-dark-muted)}.bty-rail .seg button[aria-pressed="true"]{background:var(--on-dark);color:var(--ink)}
.bty-h{font:800 var(--t-title)/1.15 var(--font-display);margin:0}
.bty-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s-3);max-width:760px}
.bty-step{border:1px solid var(--line);border-radius:var(--r-panel);padding:var(--s-3) var(--s-4);display:flex;flex-direction:column;gap:var(--s-2)}
.bty-step.is-done{background:var(--paper)}.bty-step.is-done ul{display:none}
.bty-step__h{display:flex;align-items:center;gap:var(--s-3)}.bty-step__h b{font:700 16px/1.3 var(--font-ui)}
.bty-step__n{width:28px;height:28px;border-radius:var(--r-pill);background:var(--ink);color:var(--on-dark);display:grid;place-items:center;font:700 13px/1 var(--font-ui);flex:none}
.bty-step.is-done .bty-step__n{background:var(--plus)}.bty-step__n .ic{width:16px;height:16px;--icon-accent:currentColor}
.bty-step ul{margin:0;padding-left:calc(28px + var(--s-3) + var(--s-3));display:flex;flex-direction:column;gap:var(--s-1);line-height:1.5}
.bty-step .row{padding-left:calc(28px + var(--s-3));gap:var(--s-3);align-items:center}
.bty-form{display:flex;flex-direction:column;gap:var(--s-2);max-width:520px}
.bty-form label{font-size:var(--t-small);color:var(--muted)}
.bty-form input,.bty-form select{min-height:var(--field);border:1px solid var(--line-strong);border-radius:var(--r-control);padding:0 var(--s-3);background:var(--surface);color:var(--ink)}
@media (max-width:900px){.bty{grid-template-columns:1fr}
  .bty-rail{position:static;height:auto;overflow:visible;flex-direction:row;flex-wrap:wrap;align-items:center;gap:var(--s-2) var(--s-3);padding:var(--s-3) max(16px,env(safe-area-inset-left,0px))}
  .bty-rail .logo img{width:96px}.bty-tag{margin:0}
  .bty-rail .navg{flex-direction:row;flex-wrap:wrap;width:100%;gap:var(--s-1)}.bty-rail .navg a{min-height:36px}
  .bty-rail .rail__foot{margin:0 0 0 auto;flex-direction:row;align-items:center}.bty-mail{display:none}}
</style>
</head>
<body>
<div id="view"></div>
<div class="toast" id="toast" hidden role="status"></div>
<script src="config.js?v=202611241814"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="beauty.js?v=202611241814"></script>
</body>
</html>
