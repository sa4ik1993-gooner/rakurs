<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEYROW — система реклами для онлайн-шкіл</title>
<meta name="description" content="HEYROW тримає рекламу онлайн-школи в петлі гіпотез: кожен запуск перевіряє ідею, кожне рішення — за оплатами. Пройди квіз за хвилину.">
<link rel="icon" href="../ui/logo/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
/* Значения только из tokens.css (комплект heyrow-ui). Отступления описаны в комментариях. */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--t-head)/1.55 var(--font-ui)} /* сайт: основной текст 16px вместо 14px интерфейса, иначе на телефоне мелко */
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--s-4)}
.title{font:700 var(--t-title)/1.2 var(--font-display);margin:0 0 var(--s-3)}
.text{max-width:640px;color:var(--muted)}
.num{font-family:var(--font-data);font-variant-numeric:tabular-nums}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;height:var(--control);padding:0 var(--s-4);border-radius:var(--r-control);font:600 var(--t-body)/1 var(--font-ui);text-decoration:none;border:var(--stroke) solid transparent;cursor:pointer;transition:transform var(--fast) var(--ease)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.opt:focus-visible,.lang a:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.btn--main{background:var(--signal);color:var(--surface)}
.btn--ink{background:var(--ink);color:var(--surface)}
.btn--sec{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn:disabled{opacity:.5;cursor:default}

/* Hey-плашка */
.hey{display:inline-block;background:var(--signal);color:var(--surface);font:800 var(--t-head)/1 var(--font-display);padding:var(--s-2) var(--s-4);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);margin-bottom:var(--s-4)}

/* шапка */
.top{background:var(--ink)}
.top .wrap{display:flex;align-items:center;height:64px}
.top img{width:128px;height:auto;display:block}
.lang{margin-left:auto;display:flex;gap:var(--s-1);background:var(--ink-2);padding:var(--s-1);border-radius:8px}
.lang a{font:600 var(--t-body)/1 var(--font-ui);color:var(--line-strong);text-decoration:none;padding:var(--s-2) var(--s-3);border-radius:var(--r-control)}
.lang a[aria-current="true"]{background:var(--signal);color:var(--surface)}

/* экран 1 */
.hero{background:var(--ink);color:var(--surface)}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:var(--s-6);align-items:center;padding-top:var(--s-6);padding-bottom:var(--s-6)}
.hero h1{font:800 var(--t-hero)/1.05 var(--font-display);margin:0 0 var(--s-5);letter-spacing:-.01em;text-wrap:balance}
.hero .lead{color:var(--line);max-width:560px;margin-bottom:var(--s-6)}
.hero .btns{display:flex;gap:var(--s-3);flex-wrap:wrap}
.hero img{width:100%;max-width:420px;height:auto;display:block;justify-self:center}

/* экран «как это работает» */
.how{padding:var(--s-7) 0}
.how .grid{display:grid;grid-template-columns:1fr 260px;gap:var(--s-6);align-items:end;margin-top:var(--s-5)}
.panel{background:var(--surface);border:var(--stroke) solid var(--line);border-radius:var(--r-panel);overflow:hidden}
.rows{list-style:none;margin:0;padding:0}
.rows .head,.rows li{display:grid;grid-template-columns:48px 160px 1fr 200px;gap:var(--s-4);align-items:center;padding:var(--s-3) var(--s-4);border-bottom:var(--stroke) solid var(--line)}
.rows li:last-child{border-bottom:0}
.rows .head{font:600 var(--t-label)/1 var(--font-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-height:var(--row)}
.rows li{min-height:var(--row);font-size:var(--t-body)}
.rows li:hover{background:var(--paper)}
.rows .n{font:600 var(--t-data)/1 var(--font-data);color:var(--signal)}
.rows b{font-weight:600}
.rows .d{color:var(--muted)}
.loopback{padding:var(--s-3) var(--s-4);border-top:var(--stroke) solid var(--line);font-size:var(--t-body);color:var(--muted)}
.hiro{display:grid;gap:var(--s-3);justify-items:center;text-align:center}
.hiro img{width:200px;height:auto;display:block}
.say{font:600 var(--t-body)/1.45 var(--font-ui);background:var(--surface);border:var(--stroke) solid var(--line);border-radius:var(--r-panel);padding:var(--s-3) var(--s-4)}

/* экран 2: квиз */
.quiz-sec{padding:0 0 var(--s-7)}
.quiz{margin-top:var(--s-5);max-width:760px}
.quiz .qhead{display:flex;gap:var(--s-3);align-items:center;padding:var(--s-4);border-bottom:var(--stroke) solid var(--line)}
.quiz .qhead img{width:48px;height:48px;border-radius:50%;flex:none}
.quiz .qhead p{font-size:var(--t-body);font-weight:500}
.bar{height:4px;background:var(--track)}
.bar i{display:block;height:100%;width:0;background:var(--signal);transition:transform var(--slow) var(--ease)}
#step{padding:var(--s-5) var(--s-4)}
.q-num{font:600 var(--t-label)/1 var(--font-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:var(--s-2)}
.q-title{font:600 var(--t-head)/1.35 var(--font-ui);margin-bottom:var(--s-4)}
.opts{border:var(--stroke) solid var(--line);border-radius:var(--r-panel);overflow:hidden}
.opt{display:flex;align-items:center;gap:var(--s-3);width:100%;min-height:48px;text-align:left;font:500 var(--t-head)/1.35 var(--font-ui);color:var(--ink);background:var(--surface);border:0;border-bottom:var(--stroke) solid var(--line);padding:var(--s-3) var(--s-4);cursor:pointer;transition:background var(--fast) var(--ease)}
.opt:last-child{border-bottom:0}
.opt:hover{background:var(--paper)}
.opt::before{content:"";width:8px;height:8px;flex:none;border:var(--stroke) solid var(--line-strong)}
.opt[aria-pressed="true"]{font-weight:600}
.opt[aria-pressed="true"]::before{background:var(--signal);border-color:var(--signal)}
.q-nav{margin-top:var(--s-4)}
.back{background:none;border:0;color:var(--muted);font:500 var(--t-body) var(--font-ui);cursor:pointer;padding:var(--s-2) 0}
.back:hover{text-decoration:underline}
.back[hidden]{display:block;visibility:hidden}

.big{display:flex;align-items:baseline;gap:var(--s-3);flex-wrap:wrap;margin-bottom:var(--s-2)}
.big strong{font:800 var(--t-hero)/1 var(--font-display);color:var(--signal)}
.big span{font-weight:600}
.res .note{color:var(--muted);margin-bottom:var(--s-4);font-size:var(--t-body)}
.zones{list-style:none;margin:0 0 var(--s-5);padding:0;border:var(--stroke) solid var(--line);border-radius:var(--r-panel)}
.zones li{display:grid;grid-template-columns:1fr auto;gap:var(--s-1) var(--s-4);padding:var(--s-3) var(--s-4);border-bottom:var(--stroke) solid var(--line);font-size:var(--t-body)}
.zones li:last-child{border-bottom:0}
.zones b{font-weight:600}
.zones .d{grid-column:1/-1;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:var(--s-2);font:600 var(--t-body)/1 var(--font-ui);white-space:nowrap}
.st::before{content:"";width:8px;height:8px;background:var(--minus)}
.st--ok::before{background:var(--plus)}
.form-lead{font-weight:600;margin-bottom:var(--s-3)}
form{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
.field{display:grid;gap:var(--s-1)}
label{font:500 var(--t-data)/1.3 var(--font-ui);color:var(--muted)}
input{height:var(--control);font:400 var(--t-head) var(--font-ui);color:var(--ink);background:var(--surface);border:var(--stroke) solid var(--line-strong);border-radius:var(--r-control);padding:0 var(--s-3);width:100%}
input:focus{outline:2px solid var(--signal);outline-offset:2px}
input[aria-invalid="true"]{border-color:var(--minus)}
form .btn{grid-column:1/-1;justify-self:start}
.err{grid-column:1/-1;color:var(--minus);font-size:var(--t-body)}
.fine{font-size:var(--t-data);color:var(--muted);margin-top:var(--s-3)}
.done{display:flex;gap:var(--s-4);align-items:flex-start}
.done img{width:64px;height:64px;border-radius:50%;flex:none}
.done b{display:block;font-size:var(--t-head);margin-bottom:var(--s-1)}
.done p{color:var(--muted);font-size:var(--t-body)}

/* экран 3: цена */
.price{background:var(--ink);color:var(--surface);padding:var(--s-7) 0}
.price .grid{display:grid;grid-template-columns:1fr 1fr 220px;gap:var(--s-6);align-items:start}
.price .text{color:var(--line)}
.amount{display:inline-flex;align-items:baseline;gap:var(--s-5);margin:var(--s-6) 0 var(--s-2)}
.amount>span{color:var(--line-strong)}
.ring{position:relative;display:inline-block}
.ring strong{font:800 var(--t-hero)/1 var(--font-display);color:var(--signal)}
.ring img{position:absolute;left:50%;top:50%;width:calc(100% + 100px);height:auto;transform:translate(-50%,-46%);pointer-events:none}
.mark{font:600 24px/1.1 var(--font-hand);color:var(--signal);margin:var(--s-1) 0 var(--s-5) var(--s-5)} /* пометка Хиро, Caveat 24px по п. 4 */
.incl{list-style:none;margin:0;padding:0;border-top:var(--stroke) solid var(--ink-line)}
.incl li{padding:var(--s-3) 0;border-bottom:var(--stroke) solid var(--ink-line);font-size:var(--t-body)}
.incl b{display:block;font-weight:600;font-size:var(--t-head)}
.incl span{color:var(--line-strong)}
.price .hiro img{width:200px}
.price .say{background:var(--ink-2);border-color:var(--ink-line);color:var(--surface)}
.price .btns{margin-top:var(--s-6)}
footer{background:var(--ink);color:var(--line-strong);border-top:var(--stroke) solid var(--ink-line);font-size:var(--t-data)}
footer .wrap{display:flex;justify-content:space-between;gap:var(--s-3);flex-wrap:wrap;padding-top:var(--s-5);padding-bottom:var(--s-5)}

@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr}
  .hero .wrap{gap:var(--s-2);padding-top:var(--s-4)}
  .hero img{max-width:168px;order:-1}
  .how .grid,.price .grid{grid-template-columns:1fr}
  .hiro{grid-template-columns:120px 1fr;justify-items:start;text-align:left;align-items:center}
  .hiro img,.price .hiro img{width:120px}
  .rows .head{display:none}
  .rows li{grid-template-columns:32px 1fr;gap:var(--s-1) var(--s-3);align-items:start;padding:var(--s-3) var(--s-4)}
  .rows li .d,.rows li .w{grid-column:2}
  .rows li .w{color:var(--ink);font-weight:500}
}
@media (max-width:520px){
  form{grid-template-columns:1fr}
  form .btn{justify-self:stretch}
  .hero .btns .btn{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img src="img/logo-on-dark.svg" alt="HEYROW" width="128" height="56">
  <nav class="lang" aria-label="Language"><a data-lang="uk">UA</a><a data-lang="ru">RU</a></nav>
</div></header>

<main>
<!-- Экран 1: идея -->
<section class="hero"><div class="wrap">
  <div>
    <span class="hey">Hey!</span>
    <h1 data-t="h_h1"></h1>
    <p class="lead" data-t="h_sub"></p>
    <div class="btns"><a class="btn btn--main" href="#quiz" data-t="h_cta"></a><a class="btn btn--sec" href="#how" data-t="h_cta2"></a></div>
  </div>
  <img src="img/hey.webp" alt="" width="420" height="420" fetchpriority="high">
</div></section>

<!-- Как это работает: петля гипотез -->
<section class="how" id="how"><div class="wrap">
  <h2 class="title" data-t="l_h2"></h2>
  <p class="text" data-t="l_text"></p>
  <div class="grid">
    <div class="panel">
      <ul class="rows">
        <li class="head" aria-hidden="true"><span>№</span><span data-t="l_c1"></span><span data-t="l_c2"></span><span data-t="l_c3"></span></li>
        <li><span class="n">01</span><b data-t="t1"></b><span class="d" data-t="t1d"></span><span class="w" data-t="t1w"></span></li>
        <li><span class="n">02</span><b data-t="t2"></b><span class="d" data-t="t2d"></span><span class="w" data-t="t2w"></span></li>
        <li><span class="n">03</span><b data-t="t3"></b><span class="d" data-t="t3d"></span><span class="w" data-t="t3w"></span></li>
        <li><span class="n">04</span><b data-t="t4"></b><span class="d" data-t="t4d"></span><span class="w" data-t="t4w"></span></li>
        <li><span class="n">05</span><b data-t="t5"></b><span class="d" data-t="t5d"></span><span class="w" data-t="t5w"></span></li>
      </ul>
      <p class="loopback" data-t="loop_note"></p>
    </div>
    <div class="hiro"><img src="img/work.webp" alt="" width="200" height="200" loading="lazy"><p class="say" data-t="l_say"></p></div>
  </div>
</div></section>

<!-- Экран 2: квиз -->
<section class="quiz-sec" id="quiz"><div class="wrap">
  <h2 class="title" data-t="q_h2"></h2>
  <p class="text" data-t="q_lead"></p>
  <div class="panel quiz" aria-live="polite">
    <div class="qhead"><img src="img/av-point.webp" alt="" width="48" height="48"><p data-t="q_say"></p></div>
    <div class="bar"><i id="bar"></i></div>
    <div id="step"></div>
  </div>
</div></section>

<!-- Экран 3: цена и что входит -->
<section class="price" id="price"><div class="wrap">
  <div class="grid">
    <div>
      <h2 class="title" data-t="p_h2"></h2>
      <p class="text" data-t="p_cmp"></p>
      <div class="amount"><span data-t="p_from"></span><span class="ring"><strong class="num">$69</strong><img src="img/circle.svg" alt=""></span><span data-t="p_per"></span></div>
      <p class="mark" data-t="p_mark"></p>
      <a class="btn btn--main" href="#quiz" data-t="f_cta"></a>
    </div>
    <ul class="incl">
      <li><b data-t="i1"></b><span data-t="i1d"></span></li>
      <li><b data-t="i2"></b><span data-t="i2d"></span></li>
      <li><b data-t="i3"></b><span data-t="i3d"></span></li>
      <li><b data-t="i4"></b><span data-t="i4d"></span></li>
    </ul>
    <div class="hiro"><img src="img/save.webp" alt="" width="200" height="200" loading="lazy"><p class="say" data-t="p_say"></p></div>
  </div>
</div></section>
</main>
<footer><div class="wrap"><span>HEYROW · hey-row.com</span><span data-t="foot"></span></div></footer>

<script>
const CONFIG = {
  formEndpoint: "",   // адрес веб-приложения Google Apps Script (landing-form/README.md); пусто = режим просмотра
  metaPixelId: ""     // ID пикселя Meta; пусто = пиксель не подключается
};

/* Вопросы квиза. Третий элемент 1 у ответа = зона, где рвётся система. */
const Q = {
uk:[
 {k:"role",t:"Хто ти в школі?",o:[["owner","Власник або продюсер"],["targetologist","Таргетолог або агенція"],["marketer","Маркетолог"]]},
 {k:"budget",t:"Скільки школа витрачає на рекламу на місяць?",o:[["<1000","до $1 000"],["1000-3000","$1 000–3 000"],["3000-10000","$3 000–10 000"],["10000+","понад $10 000"]]},
 {k:"funnel",t:"Як школа продає?",o:[["webinar","Вебінар або автовебінар"],["marathon","Марафон чи інтенсив"],["direct","Одразу з лендингу або через менеджера"],["other","Інакше"]]},
 {k:"read",t:"За чим ви вирішуєте, що креатив спрацював?",o:[["pay","За оплатами"],["cpl","За ціною ліда",1],["feel","За CTR і відчуттями",1]]},
 {k:"hyp",t:"Що змінюється від запуску до запуску?",o:[["test","Перевіряємо конкретну гіпотезу"],["creo","Просто міняємо креативи",1],["same","Крутимо офер у лоб, поки працює",1]]},
 {k:"mem",t:"Якщо таргетолог піде завтра, що залишиться?",o:[["all","Уся історія тестів з висновками"],["part","Кабінет і пара таблиць",1],["none","Майже нічого",1]]},
 {k:"speed",t:"Скільки гіпотез ви перевіряєте за місяць?",o:[["5","5 і більше"],["few","1–4",1],["zero","Не рахуємо",1]]}
],
ru:[
 {k:"role",t:"Кто ты в школе?",o:[["owner","Владелец или продюсер"],["targetologist","Таргетолог или агентство"],["marketer","Маркетолог"]]},
 {k:"budget",t:"Сколько школа тратит на рекламу в месяц?",o:[["<1000","до $1 000"],["1000-3000","$1 000–3 000"],["3000-10000","$3 000–10 000"],["10000+","больше $10 000"]]},
 {k:"funnel",t:"Как школа продаёт?",o:[["webinar","Вебинар или автовебинар"],["marathon","Марафон или интенсив"],["direct","Сразу с лендинга или через менеджера"],["other","Иначе"]]},
 {k:"read",t:"По чему вы решаете, что креатив сработал?",o:[["pay","По оплатам"],["cpl","По цене лида",1],["feel","По CTR и ощущениям",1]]},
 {k:"hyp",t:"Что меняется от запуска к запуску?",o:[["test","Проверяем конкретную гипотезу"],["creo","Просто меняем креативы",1],["same","Крутим оффер в лоб, пока работает",1]]},
 {k:"mem",t:"Если таргетолог уйдёт завтра, что останется?",o:[["all","Вся история тестов с выводами"],["part","Кабинет и пара таблиц",1],["none","Почти ничего",1]]},
 {k:"speed",t:"Сколько гипотез вы проверяете за месяц?",o:[["5","5 и больше"],["few","1–4",1],["zero","Не считаем",1]]}
]};

/* Зоны: название, что делаем, если рвётся; подпись, если в порядке. */
const Z = {
uk:{read:["Результат за ціною ліда","Дешевий лід ще не оплата. Показую окупність кожного креативу за оплатами.","Читаєте за оплатами"],
    hyp:["Запуски без гіпотези","Кожен запуск відповідає на одне питання: кут, офер або перший крок.","Запуски перевіряють гіпотези"],
    mem:["Знання йдуть разом з людьми","Кожна перевірка записана з висновком. Новий таргетолог продовжує з того ж місця.","Історія тестів зберігається"],
    speed:["Петля крутиться повільно","Більше перевірених гіпотез на місяць, швидше знаходиться зв'язка, яка окупається.","Темп перевірок нормальний"]},
ru:{read:["Результат по цене лида","Дешёвый лид ещё не оплата. Показываю окупаемость каждого креатива по оплатам.","Читаете по оплатам"],
    hyp:["Запуски без гипотезы","Каждый запуск отвечает на один вопрос: угол, оффер или первый шаг.","Запуски проверяют гипотезы"],
    mem:["Знания уходят вместе с людьми","Каждая проверка записана с выводом. Новый таргетолог продолжает с того же места.","История тестов сохраняется"],
    speed:["Петля крутится медленно","Больше проверенных гипотез в месяц, быстрее находится связка, которая окупается.","Темп проверок нормальный"]}
};

const T = {
uk:{
title:"HEYROW — система реклами для онлайн-шкіл",
h_h1:"Реклама школи як система",
h_sub:"Я Хіро. У мене кожен запуск перевіряє гіпотезу, а кожне рішення приймається за оплатами. Висновки лишаються в проєкті, навіть якщо змінився таргетолог.",

const params = new URLSearchParams(location.search);
const lang = params.get("lang") === "ru" ? "ru" : "uk";
const t = T[lang], qs = Q[lang], zs = Z[lang];
document.documentElement.lang = lang; document.title = t.title;
document.querySelectorAll("[data-t]").forEach(el => { const v = t[el.dataset.t]; if (v != null) el.textContent = v; });
document.querySelectorAll(".lang a").forEach(a => { const q = new URLSearchParams(location.search); q.set("lang", a.dataset.lang); a.href = "?" + q; a.setAttribute("aria-current", a.dataset.lang === lang); });

if (CONFIG.metaPixelId) {
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
  s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");
  window.fbq("init", CONFIG.metaPixelId); window.fbq("track", "PageView");
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const box = document.getElementById("step"), bar = document.getElementById("bar");
bar.style.width = "100%"; bar.style.transformOrigin = "left";
const setBar = f => { bar.style.transform = `scaleX(${f})`; };
const ans = {}; let i = 0, started = false;

function render() {
  setBar(i / qs.length);
  if (i >= qs.length) return result();
  const q = qs[i];
  box.innerHTML = `<p class="q-num">${t.q_of.replace("{n}", i + 1).replace("{m}", qs.length)}</p>
    <p class="q-title">${esc(q.t)}</p>
    <div class="opts">${q.o.map(o => `<button type="button" class="opt" data-v="${esc(o[0])}" aria-pressed="${ans[q.k] === o[0]}">${esc(o[1])}</button>`).join("")}</div>
    <div class="q-nav"><button type="button" class="back" ${i ? "" : "hidden"}>← ${t.q_back}</button></div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (!started) { started = true; if (window.fbq) fbq("trackCustom", "QuizStart"); }
    ans[q.k] = b.dataset.v; i++; render();
  });
  box.querySelector(".back").onclick = () => { i--; render(); };
}

function lossOf(k) { const q = qs.find(x => x.k === k); const o = q.o.find(x => x[0] === ans[k]); return !!(o && o[2]); }
function label(n) { return n === 1 ? t.r_lbl1 : (n >= 2 && n <= 4 ? t.r_lbl2 : t.r_lbl5); }

function result() {
  setBar(1);
  const keys = ["read", "hyp", "mem", "speed"];
  const lost = keys.filter(lossOf);
  const budget = qs[1].o.find(o => o[0] === ans.budget)?.[1] || "";
  const head = lost.length
    ? `<div class="big"><strong class="num">${lost.length}</strong><span>${esc(label(lost.length))}</span></div>`
    : `<div class="big"><span style="font-size:var(--t-head)">${esc(t.r_h0)}</span></div>`;
  box.innerHTML = `<div class="res">${head}
    <p class="note">${esc(lost.length ? t.r_note.replace("{b}", budget) : t.r_note0)}</p>
    <ul class="zones">${keys.map(k => lossOf(k)
      ? `<li><b>${esc(zs[k][0])}</b><span class="st">${esc(t.s_bad)}</span><span class="d">${esc(zs[k][1])}</span></li>`
      : `<li><b>${esc(zs[k][2])}</b><span class="st st--ok">${esc(t.s_ok)}</span></li>`).join("")}</ul>
    <p class="form-lead">${esc(t.r_form)}</p>
    <form id="lead" novalidate>
      <div class="field"><label for="f-name">${t.f_name}</label><input id="f-name" name="name" autocomplete="name"></div>
      <div class="field"><label for="f-contact">${t.f_contact}</label><input id="f-contact" name="contact" autocomplete="tel"></div>
      <div class="field" style="grid-column:1/-1"><label for="f-school">${t.f_school}</label><input id="f-school" name="school"></div>
      <p class="err" id="lead-err" hidden>${t.f_err}</p>
      <button class="btn btn--main" type="submit">${t.f_submit}</button>
    </form>
    <p class="fine">${t.f_fine}</p>
    <div class="q-nav"><button type="button" class="back">← ${t.q_back}</button></div></div>`;
  box.querySelector(".back").onclick = () => { i = qs.length - 1; render(); };
  const form = document.getElementById("lead");
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const err = document.getElementById("lead-err");
    const bad = [form.name, form.contact].filter(f => !f.value.trim());
    [form.name, form.contact].forEach(f => f.setAttribute("aria-invalid", bad.includes(f)));
    if (bad.length) { err.hidden = false; return; }
    form.querySelector("button").disabled = true;
    const data = Object.assign({}, ans, Object.fromEntries(new FormData(form)));
    data.zones = lost.join(","); data.lang = lang; data.page = location.href.split("?")[0]; data.sent_at = new Date().toISOString();
    ["utm_source","utm_medium","utm_campaign","utm_content","utm_term","fbclid"].forEach(k => { if (params.get(k)) data[k] = params.get(k); });
    data.event_id = "lead-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    if (CONFIG.formEndpoint) {
      try { await fetch(CONFIG.formEndpoint, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(data) }); } catch (_) {}
    }
    if (window.fbq) fbq("track", "Lead", { content_name: "demo_lesson" }, { eventID: data.event_id });
    box.innerHTML = `<div class="done"><img src="img/av-watch.webp" alt="" width="64" height="64"><div><b>${esc(t.d_h)}</b><p>${esc(t.d_p)}</p>${CONFIG.formEndpoint ? "" : `<p class="fine">${esc(t.d_prev)}</p>`}</div></div>`;
  });
}
render();
