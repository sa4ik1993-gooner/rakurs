<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEYROW — система трафіку для онлайн-шкіл</title>
<meta name="description" content="HEYROW бере на себе запуск, щоденний контроль і окупність реклами онлайн-школи. Пройдіть квіз — покажемо, де ваш трафік втрачає гроші.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--ink:#0D1424;--ink-2:#1B2438;--ink-line:#2C3650;--paper:#F2F4F8;--signal:#FF5A1F;--signal-soft:#FFE5DA;--muted:#5B6478;--line:#DDE1EA;--on-dark:#A9B2C6;--mint:#1FC28B;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;--body:"Golos Text","Segoe UI",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:#fff;font:17px/1.6 var(--body)}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance}
h2{font-size:clamp(24px,3.4vw,34px);font-weight:700;margin-bottom:12px}
h3{font-size:16px;font-weight:700}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
section{padding:64px 0}
.eyebrow{display:inline-block;font:700 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--signal);margin-bottom:14px}
.lead{font-size:19px;color:var(--on-dark);max-width:620px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 16px/1 var(--body);text-decoration:none;border:0;border-radius:14px;padding:17px 24px;cursor:pointer;background:var(--signal);color:#fff}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn--ghost{background:transparent;border:1px solid var(--ink-line);color:#fff}

.top{display:flex;align-items:center;gap:12px;height:68px}
.top svg{width:112px;height:auto}
.lang{margin-left:auto;display:flex;gap:4px}
.lang a{font:600 13px/1 var(--body);text-decoration:none;color:var(--on-dark);padding:8px 10px;border-radius:999px}
.lang a[aria-current="true"]{background:var(--ink-2);color:#fff}

/* screen 1 */
.hero{padding:40px 0 72px;border-bottom:1px solid var(--ink-line)}
.hero h1{font-size:clamp(30px,4.6vw,50px);font-weight:800;letter-spacing:-.02em;max-width:880px}
.hero h1 b{color:var(--signal);font-weight:800}
.hero .lead{margin-top:20px}
.take{counter-reset:k;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:40px 0 36px;padding:0;list-style:none}
.take li{background:var(--ink-2);border:1px solid var(--ink-line);border-radius:18px;padding:18px}
.take li{counter-increment:k;position:relative}
.take li::before{content:counter(k);display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:var(--signal);color:#fff;font:800 14px/1 var(--display);margin-bottom:14px}
.take li:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:20px;color:var(--signal);font:800 16px/1 var(--display)}
.loop-note{margin:-18px 0 32px;color:var(--on-dark);font-size:14px}
.take span{display:block;color:var(--on-dark);font-size:14px;margin-top:6px;line-height:1.45}
.cta-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cta-row small{color:var(--on-dark);font-size:14px}

/* screen 2: quiz */
.quiz-sec{background:var(--paper);color:var(--ink)}
.quiz-sec .lead{color:var(--muted)}
.quiz{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;max-width:760px}
.bar{height:6px;background:var(--paper);border-radius:99px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;width:0;background:var(--signal);transition:width .25s ease}
.q-num{font:600 13px/1 var(--body);color:var(--muted);margin-bottom:10px}
.q-title{font:700 clamp(19px,2.4vw,24px)/1.25 var(--display);margin-bottom:20px}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;font:500 16px/1.35 var(--body);color:var(--ink);background:var(--paper);border:2px solid transparent;border-radius:14px;padding:15px 16px;cursor:pointer}
.opt:hover{border-color:var(--line)}
.opt[aria-pressed="true"]{border-color:var(--signal);background:var(--signal-soft)}
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.back{background:none;border:0;color:var(--muted);font:500 15px var(--body);cursor:pointer;padding:8px 0}
.back[hidden]{display:block;visibility:hidden}

.res h3{font:800 clamp(22px,3vw,30px)/1.15 var(--display);margin-bottom:10px}
.res h3 b{color:var(--signal)}
.res .note{color:var(--muted);margin-bottom:18px}
.zones{display:grid;gap:10px;margin:0 0 22px;padding:0;list-style:none}
.zones li{border-left:4px solid var(--signal);background:var(--paper);border-radius:0 14px 14px 0;padding:12px 16px}
.zones b{display:block}
.zones span{font-size:15px;color:var(--muted)}
.zones li.ok{border-left-color:var(--mint)}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.field{display:grid;gap:6px}
label{font-size:13px;font-weight:600;color:var(--muted)}
input{font:16px var(--body);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;width:100%}
input:focus{outline:3px solid var(--signal);outline-offset:1px}
form .btn{grid-column:1/-1}
.err{grid-column:1/-1;color:#C2410C;font-size:14px}
.fine{font-size:13px;color:var(--muted);margin-top:12px}
.done h3{font:800 26px/1.2 var(--display);margin-bottom:8px}
.done p{color:var(--muted)}

/* screen 3: price */
.price{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:start}
.price__big{font:800 clamp(44px,7vw,68px)/1 var(--display);letter-spacing:-.02em;margin:6px 0 14px}
.price__big small{font:500 18px var(--body);color:var(--on-dark);letter-spacing:0}
.price .lead{font-size:17px}
.incl{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.incl li{display:flex;gap:14px;align-items:flex-start;background:var(--ink-2);border:1px solid var(--ink-line);border-radius:16px;padding:16px 18px}
.incl li::before{content:"✓";flex:none;font:800 15px/24px var(--display);color:var(--signal)}
.incl b{display:block}
.incl span{color:var(--on-dark);font-size:15px}
.final{margin-top:44px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--signal);border-radius:22px;padding:26px 28px}
.final p{font:700 clamp(18px,2.4vw,24px)/1.25 var(--display);max-width:620px}
.final .btn{background:var(--ink)}
footer{padding:28px 0;font-size:13px;color:var(--on-dark);border-top:1px solid var(--ink-line)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
@media (max-width:900px){.take{grid-template-columns:1fr 1fr}.take li::after{display:none}.price{grid-template-columns:1fr}}
@media (max-width:520px){.take{grid-template-columns:1fr}form{grid-template-columns:1fr}.quiz{padding:20px}section{padding:52px 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const params = new URLSearchParams(location.search);
const lang = params.get("lang") === "ru" ? "ru" : "uk";
const t = T[lang], qs = Q[lang], zs = Z[lang];
document.documentElement.lang = lang; document.title = t.title;
document.querySelectorAll("[data-t]").forEach(el => { const v = t[el.dataset.t]; if (v == null) return; el.hasAttribute("data-html") ? el.innerHTML = v : el.textContent = v; });
document.querySelectorAll(".lang a").forEach(a => { const q = new URLSearchParams(location.search); q.set("lang", a.dataset.lang); a.href = "?" + q; a.setAttribute("aria-current", a.dataset.lang === lang); });

if (CONFIG.metaPixelId) {
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
  s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");
  window.fbq("init", CONFIG.metaPixelId); window.fbq("track", "PageView");
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const box = document.getElementById("step"), bar = document.getElementById("bar");
const ans = {}; let i = 0, started = false;

function render() {
  bar.style.width = (i / qs.length * 100) + "%";
  if (i >= qs.length) return result();
  const q = qs[i];
  box.innerHTML = `<p class="q-num">${t.q_of.replace("{n}", i + 1).replace("{m}", qs.length)}</p>
    <p class="q-title">${esc(q.t)}</p>
    <div class="opts">${q.o.map(o => `<button type="button" class="opt" data-v="${esc(o[0])}" aria-pressed="${ans[q.k] === o[0]}">${esc(o[1])}</button>`).join("")}</div>
    <div class="q-nav"><button type="button" class="back" ${i ? "" : "hidden"}>${t.q_back}</button></div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (!started) { started = true; if (window.fbq) fbq("trackCustom", "QuizStart"); }
    ans[q.k] = b.dataset.v; i++; render();
  });
  box.querySelector(".back").onclick = () => { i--; render(); };
}

function lossOf(k) { const q = qs.find(x => x.k === k); const o = q.o.find(x => x[0] === ans[k]); return !!(o && o[2]); }
function word(n) { return n === 1 ? t.w1 : (n >= 2 && n <= 4 ? t.w2 : t.w5); }

function result() {
  bar.style.width = "100%";
  const keys = ["read", "hyp", "mem", "speed"];
  const lost = keys.filter(lossOf);
  const budget = qs[1].o.find(o => o[0] === ans.budget)?.[1] || "";
  box.innerHTML = `<div class="res">
    <h3>${lost.length ? t.r_h.replace("{n}", lost.length).replace("{w}", word(lost.length)) : esc(t.r_h0)}</h3>
    <p class="note">${esc(lost.length ? t.r_note.replace("{b}", budget) : t.r_note0)}</p>
    ${lost.length ? `<ul class="zones">${lost.map(k => `<li><b>${esc(zs[k][0])}</b><span>${esc(zs[k][1])}</span></li>`).join("")}</ul>` : ""}
    <p style="font-weight:600;margin-bottom:12px">${esc(t.r_form)}</p>
    <form id="lead" novalidate>
      <div class="field"><label for="f-name">${t.f_name}</label><input id="f-name" name="name" autocomplete="name"></div>
      <div class="field"><label for="f-contact">${t.f_contact}</label><input id="f-contact" name="contact" autocomplete="tel"></div>
      <div class="field" style="grid-column:1/-1"><label for="f-school">${t.f_school}</label><input id="f-school" name="school"></div>
      <p class="err" id="lead-err" hidden>${t.f_err}</p>
      <button class="btn" type="submit">${t.f_submit}</button>
    </form>
    <p class="fine">${t.f_fine}</p>
    <div class="q-nav"><button type="button" class="back">${t.q_back}</button></div></div>`;
  box.querySelector(".back").onclick = () => { i = qs.length - 1; render(); };
  const form = document.getElementById("lead");
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const err = document.getElementById("lead-err");
    if (!form.name.value.trim() || !form.contact.value.trim()) { err.hidden = false; return; }
    form.querySelector("button").disabled = true;
    const data = Object.assign({}, ans, Object.fromEntries(new FormData(form)));
    data.zones = lost.join(","); data.lang = lang; data.page = location.href.split("?")[0]; data.sent_at = new Date().toISOString();
    ["utm_source","utm_medium","utm_campaign","utm_content","utm_term","fbclid"].forEach(k => { if (params.get(k)) data[k] = params.get(k); });
    data.event_id = "lead-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    if (CONFIG.formEndpoint) {
      try { await fetch(CONFIG.formEndpoint, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(data) }); } catch (_) {}
    }
    if (window.fbq) fbq("track", "Lead", { content_name: "demo_lesson" }, { eventID: data.event_id });
    box.innerHTML = `<div class="done"><h3>${esc(t.d_h)}</h3><p>${esc(t.d_p)}</p>${CONFIG.formEndpoint ? "" : `<p class="fine">${esc(t.d_prev)}</p>`}</div>`;
  });
}
