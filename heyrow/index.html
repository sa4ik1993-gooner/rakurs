<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEYROW — окупність трафіку онлайн-школи</title>
<meta name="description" content="HEYROW зводить оплати з рекламою Meta і показує, які кампанії та креативи онлайн-школи приносять гроші, а які зливають бюджет.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0D1424;--ink-2:#1B2438;--ink-line:#2C3650;--paper:#F2F4F8;--signal:#FF5A1F;--signal-soft:#FFE5DA;--muted:#5B6478;--line:#DDE1EA;--on-dark:#A9B2C6;--mint:#1FC28B;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;--body:"Golos Text","Segoe UI",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font:17px/1.6 var(--body)}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance}
h2{font-size:clamp(26px,4vw,38px);font-weight:700;margin-bottom:12px}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
section{padding:72px 0}
.eyebrow{display:inline-block;font:700 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--signal);margin-bottom:14px}
.lead{font-size:19px;color:var(--muted);max-width:640px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 16px/1 var(--body);text-decoration:none;border:0;border-radius:14px;padding:16px 22px;cursor:pointer;background:var(--signal);color:#fff}
.btn:hover{filter:brightness(1.06)}
.btn--ghost{background:transparent;color:inherit;border:1px solid currentColor}
.dark{background:var(--ink);color:#fff}
.dark .lead{color:var(--on-dark)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}
.dark .card{background:var(--ink-2);border-color:var(--ink-line)}

/* top */
.top{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;border-bottom:1px solid var(--ink-line)}
.top__row{display:flex;align-items:center;gap:16px;height:64px}
.top__logo{display:block;width:118px;height:auto}
.lang{margin-left:auto;display:flex;gap:4px}
.lang a{font:600 13px/1 var(--body);text-decoration:none;color:var(--on-dark);padding:8px 10px;border-radius:999px}
.lang a[aria-current="true"]{background:var(--ink-2);color:#fff}
.top .btn{padding:11px 16px;font-size:14px}

/* hero */
.hero{padding:64px 0 80px}
.hero__grid{display:grid;grid-template-columns:1.15fr 1fr;gap:44px;align-items:center}
.hero h1{font-size:clamp(28px,3.8vw,44px);font-weight:800;letter-spacing:-.02em}
.hero h1 b{color:var(--signal);font-weight:800}
.hero .lead{margin-top:18px}
.hero__cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero__note{margin-top:14px;font-size:14px;color:var(--on-dark)}
.report{background:#fff;color:var(--ink);border-radius:22px;padding:20px;box-shadow:0 24px 60px -30px rgba(0,0,0,.6)}
.report__head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.report__head b{font:700 14px/1.2 var(--display)}
.report__head span{font-size:12px;color:var(--muted);background:var(--paper);border-radius:999px;padding:4px 10px;white-space:nowrap}
.report table{width:100%;border-collapse:collapse;font-size:14px}
.report th{font-weight:600;color:var(--muted);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-size:12px}
.report th:first-child,.report td:first-child{text-align:left}
.report td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.report tr:last-child td{border-bottom:0}
.pos{color:#13805C;font-weight:600}
.neg{color:#C2410C;font-weight:600}
.row-mark{display:inline-block;width:8px;height:8px;margin-right:8px;background:var(--signal);vertical-align:middle}
.report__foot{margin-top:12px;font-size:13px;color:var(--muted)}

/* roles */
.role .k{display:inline-block;font:700 12px/1 var(--display);color:#fff;background:var(--ink);border-radius:10px;padding:8px 10px;margin-bottom:14px}
.role:first-child .k{background:var(--signal)}
.role p{color:var(--muted);font-size:15px;margin-top:8px}
.role q{display:block;margin-top:14px;font-size:15px;font-weight:500;color:var(--ink);border-left:3px solid var(--signal);padding-left:12px;quotes:"«" "»"}

/* steps */
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:32px}
.step{counter-increment:s}
.step::before{content:counter(s);display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--signal);color:#fff;font:800 18px/1 var(--display);margin-bottom:16px}
.step p{color:var(--on-dark);font-size:15px;margin-top:8px}

/* inside */
.inside{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:28px;padding:0;list-style:none}
.inside li{display:flex;gap:14px;align-items:flex-start;background:var(--paper);border-radius:16px;padding:16px 18px;font-size:15px}
.inside li::before{content:"";flex:none;width:10px;height:22px;background:var(--signal)}
.inside b{display:block;font-size:16px}
.inside span{color:var(--muted)}

/* price */
.price{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.price__big{font:800 clamp(44px,7vw,72px)/1 var(--display);letter-spacing:-.02em}
.price__big small{font:500 18px var(--body);color:var(--muted);letter-spacing:0}
.price__cmp{margin-top:14px;font-size:18px}
.price ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.price li{padding-left:22px;position:relative;font-size:15px;color:var(--muted)}
.price li::before{content:"";position:absolute;left:0;top:9px;width:10px;height:3px;background:var(--signal)}

/* faq */
.faq{max-width:760px}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::after{content:"+";font:700 20px/1 var(--display);color:var(--signal)}
.faq details[open] summary::after{content:"−"}
.faq details p{margin-top:10px;color:var(--muted);font-size:15px}

/* form */
.book{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:start}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--ink-2);border:1px solid var(--ink-line);border-radius:22px;padding:24px}
.field{display:grid;gap:6px}
.field--wide{grid-column:1/-1}
label{font-size:13px;font-weight:600;color:var(--on-dark)}
input,select{font:16px var(--body);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%}
input:focus,select:focus{outline:3px solid var(--signal);outline-offset:1px}
form .btn{grid-column:1/-1;margin-top:4px}
.err{grid-column:1/-1;color:#FF9A85;font-size:14px}
.ok{background:var(--ink-2);border:1px solid var(--ink-line);border-radius:22px;padding:28px}
.ok h3{font-size:22px;margin-bottom:8px}
.ok p{color:var(--on-dark)}
.fine{font-size:13px;color:var(--on-dark);margin-top:16px}

footer{padding:28px 0;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
@media (max-width:860px){
  .hero__grid,.price,.book{grid-template-columns:1fr}
  section{padding:56px 0}
}
@media (max-width:520px){
  form{grid-template-columns:1fr}
  .top .btn{display:none}
  .report{padding:14px}
  .report table{font-size:13px}
}
</style>
</head>
